name: Core verification (offline)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Deliberately no provider credentials or live endpoint.
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core and verifier tools (no Superlinked extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Assert core is SDK-free
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('sie_sdk') is None, 'Provider SDK installed in offline job'"
      - name: Record resolved versions (no credentials)
        run: |
          python --version
          python -m pip list --format=freeze
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Focused mypy
        run: python -m mypy
      - name: Offline unit and contract tests
        run: python -m pytest -q
